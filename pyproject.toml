[project]
name = "pydemo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GreedyFoolish", email = "1158984036@qq.com" }
]
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = [
    "package/*",
    "app/*",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "python-dotenv>=1.2.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
markers = [
    "smoke: 标记为冒烟测试，验证核心流程是否正常",
    "skip_cleanup: 跳过每个用例前后的 TRUNCATE 清理（用于依赖 FastAPI lifespan 自动初始化种子数据的冒烟用例）",
]
