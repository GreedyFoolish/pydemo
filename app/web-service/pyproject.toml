[project]
name = "web-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GreedyFoolish", email = "1158984036@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "fastapi[standard]==0.136.3",
    "psycopg2-binary==2.9.12",
    "pydantic-settings==2.14.1",
    "sqlalchemy[asyncio]==2.0.50",
]

# [project.scripts]
# web-service = "web_service.main:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
markers = [
    "smoke: 标记为冒烟测试，验证核心流程是否正常",
]

